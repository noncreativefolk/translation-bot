name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: npm ci --no-audit --no-fund

      - name: Fetch pinned vendor assets (wllama)
        run: bash scripts/fetch-vendor.sh

      - name: Build offline team package
        run: |
          mkdir -p web/download
          (cd offline && zip -q -r ../web/download/translation-bot-offline.zip .)

      - name: Build dist/ (obfuscated app + minified HTML)
        run: npm run build

      - name: Sanity check
        run: |
          test -s dist/index.html
          test -s dist/vendor/wllama/index.js
          test -s dist/vendor/wllama/wasm/wllama.wasm
          test -s dist/download/translation-bot-offline.zip
          ls dist/a.*.js
          ! grep -q "Translate the user" dist/a.*.js   # prompts must not ship in clear text

      - name: Deploy (edge gate worker + static assets, see wrangler.jsonc)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
