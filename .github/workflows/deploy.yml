name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned vendor assets (wllama + coi-serviceworker)
        run: bash scripts/fetch-vendor.sh

      - name: Build offline team package
        run: |
          mkdir -p web/download
          (cd offline && zip -q -r ../web/download/translation-bot-offline.zip .)

      - name: Sanity check
        run: |
          test -s web/index.html
          test -s web/_headers
          test -s web/coi-serviceworker.min.js
          test -s web/vendor/wllama/index.js
          test -s web/vendor/wllama/wasm/wllama.wasm
          test -s web/download/translation-bot-offline.zip

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=translation-bot --branch=main --commit-dirty=true
